    <button id="myButton" onclick="runFuctionality(event)" > click me </button>

<script>
 let button = document.getElementById('myButton')

function runFuctionality(e) {
    let div = document.getElementById("preview")
    setLoading(true )
   
    setTimeout(() => {
       setLoading(false )
       div.innerHTML = 'you just clicked me'  
    }, 3000);  
    
}


 function setLoading(bool ) {
   button.innerHTML = bool ? 'loading...'  : 'click me'
   button.disabled = bool
 }
