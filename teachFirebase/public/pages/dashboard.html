<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Classroom - Banter</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://www.gstatic.com/firebasejs/13.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/13.1.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/13.1.0/firebase-database-compat.js"></script>
</head>
<body class="dashboard-page">

    <div class="app">

        <!-- ===== Top bar ===== -->
        <header class="app-topbar">
            <a href="dashboard.html" class="brand">
                <span class="brand-mark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                </span>
                <span>Banter</span>
            </a>

            <div class="topbar-right">
                <!-- Default text. JS replaces it with the logged-in user's details:
                     #userAvatar = first letter of their name, #userName = their name, #userEmail = their email -->
                <div class="user-chip">
                    <span class="avatar" id="userAvatar"> .. </span>
                    <div class="user-info">
                        <p class="user-name" id="userName"> Loading..</p>
                        <p class="user-email" id="userEmail"> Loading...</p>
                    </div>
                </div>

                <button type="button" id="logoutButton" onclick="logUserOut()" class="btn btn-logout">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
                    <span>Log out</span>
                </button>
            </div>
        </header>

        <!-- ===== Chat room ===== -->
        <main class="chat">

            <!-- ===== Welcome header ===== -->
            <div class="chat-header">
                <div class="welcome">
                    <span class="js-badge" aria-hidden="true">JS</span>
                    <div>
                        <!-- Default text. JS replaces "Student" with the user's name -->
                        <h1>Welcome back, <span id="welcomeName" class="gradient-text"> Loading... </span>&nbsp;👋</h1>
                        <p><strong>JavaScript Classroom</strong><span class="welcome-tagline"> &middot; Ask questions, share code and help each other out.</span></p>
                    </div>
                </div>

                <span class="live-badge"><span class="live-dot"></span>Live</span>
            </div>

            <div class="chat-body">

                <!-- Sample messages for design preview. JS can clear this container and render real messages here.
                     Give a message the class "mine" when the current user sent it. -->
                <div id="messagesContainer" class="chat-messages">

                    
                   

                 

                    

                </div>

                <!-- Shown when there are no messages. Remove the class "hidden" to show it. -->
                <div id="emptyState" class="empty-state hidden">
                    <div class="empty-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    </div>
                    <h3>The classroom is quiet</h3>
                    <p>Be the first to say hello! 👋</p>
                </div>

            </div>

            <!-- ===== Message composer ===== -->
            <div class="composer">
                <div class="composer-box">
                    <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off" aria-label="Type a message">
                    <button type="button" onclick="sendMessage()" id="sendButton" class="send-button" aria-label="Send message">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
                    </button>
                </div>
            </div>

        </main>

    </div>

</body>
</html>
<script src="../js/dashboard.js"></script>
