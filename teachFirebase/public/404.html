<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Banter</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!--
        This page keeps its styles inside it (not in css/style.css) because Firebase
        shows it for ANY broken URL, e.g. /pages/abc/xyz, where a relative CSS link
        would not load. Links below start with "/" for the same reason.
    -->
    <style>
        :root {
            --bg: #0a0b12;
            --surface-2: #1c2033;
            --border: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.14);
            --text: #eef0f8;
            --muted: #9aa1b9;
            --faint: #7a819c;
            --gradient: linear-gradient(135deg, #7c3aed 0%, #4f46e5 55%, #2563eb 100%);
            --gradient-text: linear-gradient(90deg, #a78bfa 0%, #60a5fa 50%, #22d3ee 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: var(--text);
            background:
                radial-gradient(600px 400px at 50% 0%, rgba(139, 92, 246, 0.25), transparent 70%),
                radial-gradient(500px 400px at 50% 100%, rgba(34, 211, 238, 0.1), transparent 70%),
                var(--bg);
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        :focus-visible {
            outline: 2px solid #22d3ee;
            outline-offset: 3px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 56px;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .brand-mark {
            width: 36px;
            height: 36px;
            border-radius: 11px;
            background: var(--gradient);
            display: grid;
            place-items: center;
            color: #fff;
        }

        .brand-mark svg {
            width: 19px;
            height: 19px;
        }

        .not-found {
            width: 100%;
            max-width: 520px;
            text-align: center;
        }

        .code {
            display: inline-block;
            font-size: clamp(110px, 26vw, 170px);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.06em;
            background: var(--gradient-text);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* ---------- Little chat about the missing page ---------- */

        .chat {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
            margin: 32px auto 40px;
            max-width: 360px;
            text-align: left;
        }

        .bubble {
            max-width: 85%;
            padding: 10px 16px;
            border-radius: 18px 18px 18px 6px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            font-size: 15px;
            opacity: 0;
            animation: pop-in 0.4s ease-out forwards;
        }

        .bubble.mine {
            align-self: flex-end;
            border-radius: 18px 18px 6px 18px;
            background: var(--gradient);
            border-color: transparent;
            color: #fff;
            animation-delay: 0.6s;
        }

        .bubble:nth-child(3) {
            animation-delay: 1.2s;
        }

        @keyframes pop-in {
            from { opacity: 0; transform: translateY(8px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        h1 {
            margin-bottom: 12px;
            font-size: clamp(26px, 5vw, 34px);
            line-height: 1.2;
            letter-spacing: -0.03em;
        }

        .not-found > p {
            margin: 0 auto 36px;
            max-width: 420px;
            color: var(--muted);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 24px;
            border-radius: 14px;
            border: 1px solid transparent;
            font-size: 15px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .btn svg {
            width: 18px;
            height: 18px;
        }

        .btn-primary {
            background: var(--gradient);
            color: #fff;
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.35);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 36px rgba(124, 58, 237, 0.5);
        }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.04);
            border-color: var(--border-strong);
        }

        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        footer {
            margin-top: 64px;
            color: var(--faint);
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .btn {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .bubble {
                opacity: 1;
                animation: none;
            }
        }
    </style>
</head>
<body>

    <a href="/" class="brand">
        <span class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </span>
        <span>Banter</span>
    </a>

    <main class="not-found">
        <div class="code">404</div>

        <div class="chat" aria-hidden="true">
            <p class="bubble">Hey, has anyone seen this page? 🤔</p>
            <p class="bubble mine">I've looked everywhere…</p>
            <p class="bubble">I think it left the chat 👋</p>
        </div>

        <h1>This page left the chat</h1>
        <p>The page you're looking for doesn't exist or may have been moved. Check the URL for typos, or head back to safety.</p>

        <div class="actions">
            <a href="/" class="btn btn-primary">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
                Back to home
            </a>
            <a href="/pages/dashboard.html" class="btn btn-ghost">Open chat room</a>
        </div>
    </main>

    <footer>&copy; 2026 Banter</footer>

</body>
</html>
